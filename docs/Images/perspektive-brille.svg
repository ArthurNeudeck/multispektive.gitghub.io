<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-label="Brille mit zwei unterschiedlichen Gläsern">
  <defs>
    <clipPath id="lens-left"><circle cx="185" cy="290" r="105"/></clipPath>
    <clipPath id="lens-right"><circle cx="415" cy="290" r="105"/></clipPath>
  </defs>
  <rect width="600" height="540" fill="#fbefe0"/>
  <!-- Left lens: flowing lines like the river -->
  <g clip-path="url(#lens-left)">
    <rect x="70" y="175" width="230" height="230" fill="#f6dcc2"/>
    <g fill="none" stroke="#e5773a" stroke-width="14" stroke-linecap="round">
      <path d="M60 230 C 120 200, 170 260, 230 230 S 330 200, 330 200"/>
      <path d="M60 280 C 120 250, 170 310, 230 280 S 330 250, 330 250"/>
      <path d="M60 330 C 120 300, 170 360, 230 330 S 330 300, 330 300"/>
      <path d="M60 380 C 120 350, 170 410, 230 380 S 330 350, 330 350"/>
    </g>
  </g>
  <!-- Right lens: rising sun, a different view -->
  <g clip-path="url(#lens-right)">
    <rect x="300" y="175" width="230" height="230" fill="#f6dcc2"/>
    <circle cx="415" cy="330" r="62" fill="#e5773a"/>
    <path d="M300 340 C 360 310, 470 310, 530 340 L 530 410 L 300 410 Z" fill="#c3561f"/>
    <path d="M300 372 C 360 350, 470 350, 530 372" fill="none" stroke="#e5773a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Frame -->
  <g fill="none" stroke="#c3561f" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="185" cy="290" r="105"/>
    <circle cx="415" cy="290" r="105"/>
    <path d="M285 268 C 292 245, 308 245, 315 268"/>
    <path d="M82 262 L 48 210"/>
    <path d="M518 262 L 552 210"/>
  </g>
</svg>
